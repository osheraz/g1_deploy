###############################################################
# SONIC deploy: released encoder/decoder tracker + tactile + recording.
# Run with deploy_eskin.py.
#
# Gains, action_scale and the default pose are computed from the official
# NVlabs/GR00T-WholeBodyControl reference implementation,
#   gear_sonic_deploy/src/g1/g1_deploy_onnx_ref/include/policy_parameters.hpp
#     stiffness = armature * (2*pi*10)^2
#     damping   = 2 * 2.0 * armature * (2*pi*10)
#     ankles and waist roll/pitch use 2x stiffness/damping
#     wrist pitch/yaw use the 4010 motor (16.78 / 1.068), not the 5020
#     action_scale = 0.25 * effort_limit / stiffness   -> PER JOINT
# and cross-checked against humanoidverse2/config/robot/g1/g1_23dof_sonic.yaml.
#
# These are NOT the fall-recovery numbers in g1_23dof.yaml. That policy uses a
# different standing pose and much stiffer arms; a pretrained policy has to run
# on the gains and default pose it was trained with.
###############################################################

policy_type: sonic
policy_path: "policy/sonic/model_decoder.onnx"    # informational
sonic_encoder: "policy/sonic/model_encoder.onnx"
sonic_decoder: "policy/sonic/model_decoder.onnx"
sonic_mode: "g1"
# These files are the official Default SONIC pair. The low-latency checkpoint
# has a different 1247-D encoder layout and must not be mixed into this wrapper.
sonic_model_variant: "default"

# Our robot is 23-DoF; the released policy is 29-DoF. Phantom mode maps our 23
# joints into IsaacLab's 29 (robot_g1.IL_FROM_OUR23) and locks the 6 the robot
# lacks (MISSING_IL: waist roll/pitch, both wrist pitch/yaw) at their defaults.
# Raw 29-D decoder outputs are still retained in recurrent action history,
# matching the official deployment; only physical application selects 23.
phantom_23dof: true
phantom_hold_ref_dof: true

# --mode motion defaults to a finite, neutral hold generated by
# scripts/prepare_sonic_motion.py. Do not loop an unverified locomotion clip.
sonic_motion_clip: "policy/sonic/motion_neutral_default.npz"
sonic_motion_loop: false
# The local Python wrapper mirrors the official C++ planner. Only the large
# released model remains external to this small deployment repository.
sonic_planner_onnx: "~/tactile/others/GR00T-WholeBodyControl/gear_sonic_deploy/planner/target_vel/V2/planner_sonic.onnx"
sonic_planner_version: 2
sonic_planner_default_height: 0.788740
pico_server_ip: "127.0.0.1"
pico_server_port: 5560
# Local g1_debug PUB: official PICO uses body_q_measured for VR3 wrist FK
# recalibration when entering VR3PT. The 23 measured joints are expanded to 29.
# 5557 is already the local tactile server in this deployment.
pico_feedback_port: 5558

control_dt: 0.02
max_low_state_age_s: 0.10
max_joint_velocity: 35.0
msg_type: "hg"
imu_type: "pelvis"
lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"
viser_display: true

###############################################################
# Sensors -- recorded, not consumed by the policy
###############################################################
use_depth_obs: false
use_tactile: true
tactile_sensor_order: ["LH", "RH"]
tactile_server_ip: "127.0.0.1"          # gloves plug into the workstation
tactile_server_port: 5557

depth_server_ip: "192.168.123.164"      # img_server_rgbd.py on the robot
depth_server_port: 5556
depth_raw_height: 480
depth_raw_width: 640
min_d: 0.1
max_d: 2.0
depth_scale: 0.001

###############################################################
# Joints
###############################################################
action_joint2motor_idx: [
    0, 1, 2, 3, 4, 5,        # left leg
    6, 7, 8, 9, 10, 11,      # right leg
    12,                      # waist yaw
    15, 16, 17, 18, 19,      # left arm  + wrist roll
    22, 23, 24, 25, 26,      # right arm + wrist roll
]

fixed_joint2motor_idx: [13, 14, 20, 21, 27, 28]
fixed_kps: [28.5012, 28.5012, 16.7783, 16.7783, 16.7783, 16.7783]
fixed_kds: [1.8144, 1.8144, 1.0681, 1.0681, 1.0681, 1.0681]
fixed_target: [0, 0, 0, 0, 0, 0]

# By MOTOR index (29): robot_interface indexes kps/kds by motor index and
# move_to_default_pos walks all 29.
kps: [
    99.0984, 99.0984, 40.1792, 99.0984, 28.5012, 28.5012,
    99.0984, 99.0984, 40.1792, 99.0984, 28.5012, 28.5012,
    40.1792, 28.5012, 28.5012,
    14.2506, 14.2506, 14.2506, 14.2506, 14.2506, 16.7783, 16.7783,
    14.2506, 14.2506, 14.2506, 14.2506, 14.2506, 16.7783, 16.7783
]
kds: [
    6.3088, 6.3088, 2.5579, 6.3088, 1.8144, 1.8144,
    6.3088, 6.3088, 2.5579, 6.3088, 1.8144, 1.8144,
    2.5579, 1.8144, 1.8144,
    0.9072, 0.9072, 0.9072, 0.9072, 0.9072, 1.0681, 1.0681,
    0.9072, 0.9072, 0.9072, 0.9072, 0.9072, 1.0681, 1.0681
]

default_angles: [
    -0.312, 0.000, 0.000, 0.669, -0.363, 0.000,
    -0.312, 0.000, 0.000, 0.669, -0.363, 0.000,
    0.000, 0.000, 0.000,
    0.200, 0.200, 0.000, 0.600, 0.000, 0.000, 0.000,
    0.200, -0.200, 0.000, 0.600, 0.000, 0.000, 0.000
]
default_angles_23: [
    -0.312, 0.000, 0.000, 0.669, -0.363, 0.000,
    -0.312, 0.000, 0.000, 0.669, -0.363, 0.000,
    0.000,
    0.200, 0.200, 0.000, 0.600, 0.000,
    0.200, -0.200, 0.000, 0.600, 0.000
]

###############################################################
# Action / obs
###############################################################
# PER-JOINT, our 23-dof order. NOT the scalar 0.25 the fall-recovery config
# uses -- that would be wrong on every joint by a different factor.
action_scale: [
    0.350661, 0.350661, 0.547546, 0.350661, 0.438577, 0.438577,
    0.350661, 0.350661, 0.547546, 0.350661, 0.438577, 0.438577,
    0.547546,
    0.438577, 0.438577, 0.438577, 0.438577, 0.438577,
    0.438577, 0.438577, 0.438577, 0.438577, 0.438577
]

# Hardware joint limits (MJCF g1_23dof), our 23-dof order. Targets are
# clamped to these in apply_target_dof_pos -- the only guard now that the
# waist-yaw mechanical stop is gone.
dof_lower: [
    -2.5307, -0.5236, -2.7576, -0.0873, -0.8727, -0.2618,
    -2.5307, -2.9671, -2.7576, -0.0873, -0.8727, -0.2618,
    -2.6180,
    -3.0892, -1.5882, -2.6180, -1.0472, -1.9722,
    -3.0892, -2.2515, -2.6180, -1.0472, -1.9722
]
dof_upper: [
    2.8798, 2.9671, 2.7576, 2.8798, 0.5236, 0.2618,
    2.8798, 0.5236, 2.7576, 2.8798, 0.5236, 0.2618,
    2.6180,
    2.6704, 2.2515, 2.6180, 2.0944, 1.9722,
    2.6704, 1.5882, 2.6180, 2.0944, 1.9722
]

action_ema: 1.0
num_actions: 23
num_obs: 994            # decoder obs; the encoder takes 1762
obs_dim: {}

ang_vel_scale: 1.0      # SONIC builds its own obs; these scales are unused
dof_pos_scale: 1.0
dof_vel_scale: 1.0
cmd_scale: [2.0, 2.0, 0.25]
max_cmd: [0.2, 0.2, 0.8]

clip_actions: 100.
clip_obs: 100.
reference_motion: "sonic"
reference_keyframes: 1
