###############################################################
# Depth Configuration
###############################################################

# TODO: all of this from the trained actor cfg

use_depth_obs: true
# Fall recovery only, run with deploy_g1.py. Tactile + teleop data collection
# is deploy_eskin.py with configs/g1_23dof_sonic.yaml.
use_tactile: false

# from ego_camera.clipping_range in sim
min_d: 0.1
max_d: 2.0
depth_scale: 0.001

# resolution used for observation vector
depth_img_width: 64 #96
depth_img_height: 64 #54
depth_obs_dim: 4096

depth_server_ip: "192.168.123.164"
depth_server_port: 5556

# raw RealSense depth
depth_raw_height: 480
depth_raw_width: 640

###############################################################
# Control + Teleop Config
###############################################################

viser_display: true
control_dt: 0.02

msg_type: "hg"            # "hg" or "go"
imu_type: "pelvis"        # "torso" or "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"


# Complete mapping of all 23 joints to motor indices
action_joint2motor_idx: [
    # Left Leg (6 joints)
    0,    # left_hip_pitch_joint
    1,    # left_hip_roll_joint
    2,    # left_hip_yaw_joint
    3,    # left_knee_joint
    4,    # left_ankle_pitch_joint
    5,    # left_ankle_roll_joint

    # Right Leg (6 joints)
    6,    # right_hip_pitch_joint
    7,    # right_hip_roll_joint
    8,    # right_hip_yaw_joint
    9,    # right_knee_joint
    10,   # right_ankle_pitch_joint
    11,   # right_ankle_roll_joint

    # Waist (3 joints)
    12,   # waist_yaw_joint
#    13,   # waist_roll_joint   # FIXED
#    14,   # waist_pitch_joint  # FIXED

    # Left Arm (4 joints)
    15,   # left_shoulder_pitch_joint
    16,   # left_shoulder_roll_joint
    17,   # left_shoulder_yaw_joint
    18,   # left_elbow_joint,
    19,   # left_wrist_joint
    # 20, left_wrist_pitch_joint # FIXED
    # 21, left_wrist_yaw_joint   # FIXED

    # Right Arm (4 joints)
    22,   # right_shoulder_pitch_joint
    23,   # right_shoulder_roll_joint
    24,   # right_shoulder_yaw_joint
    25,   # right_elbow_joint
    26,   # right_wrist_roll_joint
    # right_wrist_pitch_joint: 27  # FIXED
    # right_wrist_yaw_joint: 28    # FIXED
]

# PD gains for all 23 joints
# kps: [200, 200, 200, 275, 40, 40,      # Left leg
#      200, 200, 200, 275, 40, 40,      # Right leg
#      100,  4, 4,                                # Waist
#      100, 100, 100, 100, 100, 10, 10,                  # Left arm
#      100, 100, 100, 100, 100, 10, 10]                  # Right arm

# kds: [4.0, 4.0, 4.0, 6.0, 2.0, 2.0,
#       4.0, 4.0, 4.0, 6.0, 2.0, 2.0,
#       4.0, 4.0, 4.0,
#       4.0, 4.0, 4.0, 4.0, 4.0, 0.0, 0.0,
#       4.0, 4.0, 4.0, 4.0, 4.0, 0.0, 0.0]

# kps: [80, 80, 80, 100, 20, 20,      # Left leg
#       80, 80, 80, 100, 20, 20,      # Right leg
#       100, 4, 4,                                   # Waist
#       30, 20, 5, 20, 5, 5, 5,                  # Left arm
#       30, 20, 5, 20, 5, 5, 5]                  # Right arm

# kds: [2.5, 2.5, 2.5, 5.0, 0.2, 0.1,                   # Left leg
#       2.5, 2.5, 2.5, 5.0, 0.2, 0.1,                   # Right leg
#       5.0, 5.0, 5.0,                                  # Waist
#       2.0, 1.0, 0.4, 1.0, 0.4, 0.4, 0.4,              # Left arm
#       2.0, 1.0, 0.4, 1.0, 0.4, 0.4, 0.4]              # Right arm

# Matches the config the fall-recovery teacher was trained with:
# humanoidverse2/config/robot/g1/g1_23dof.yaml -- stiffness hip 100 / knee 200 /
# ankle 20 / waist_yaw 400 / shoulder 90,60,20 / elbow 60 / wrist_roll 40.
#
# CHANGED 2026-08-07: wrist_roll (motors 19 and 26) was 4 here, 10x softer than
# training, and its damping 0.2 instead of 1.0. All other active joints already
# matched. Old values, in case the soft wrist was deliberate:
#     kps[19] = kps[26] = 4        kds[19] = kds[26] = 0.2
kps: [
    100, 100, 100, 200, 20, 20,
    100, 100, 100, 200, 20, 20,
    400, 400, 400,
    90, 60, 20, 60, 40, 4, 0,
    90, 60, 20, 60, 40, 4, 4
]

kds: [
   2.5, 2.5, 2.5, 5, 0.2, 0.1,
   2.5, 2.5, 2.5, 5, 0.2, 0.1,
   5.0, 5.0, 5.0,
   2.0, 1.0, 0.4, 1.0, 1.0, 0.2, 0.2,
    2.0, 1.0, 0.4, 1.0, 1.0, 0.2, 0.2
]

# 29dof
default_angles: [-0.2, 0.0, 0.0, 0.42, -0.23, 0.0,    # Left leg
                 -0.2, 0.0, 0.0, 0.42, -0.23, 0.0,   # Right leg           
                 0.0, 0.0, 0.0,                     # Waist
                 0.35, 0.16, 0.0, 0.87,                # Left arm
                 0.0, 0.0, 0.0,                     # Left wrist
                 0.35, -0.16, 0.0, 0.87,                # Right arm
                 0.0, 0.0, 0.0]                     # Right wrist

# TODO: make sure it that same
default_angles_23: [-0.2, 0.0, 0.0, 0.42, -0.23, 0.0,    # Left leg
                   -0.2, 0.0, 0.0, 0.42, -0.23, 0.0,     # Right leg
                   0.0,                                  # Waist
                   0.35, 0.16, 0.0, 0.87, 0.0,           # Left arm
                   0.35, -0.16, 0.0, 0.87, 0.0]          # Right arm

# For backwards compatibility with fixed joints section
# If you need to use fixed joints, update this as needed
# fixed_joint2motor_idx: [13, 14, 19, 20, 21, 26, 27, 28]

fixed_joint2motor_idx: [13, 14, 20, 21, 27, 28]
fixed_kps: [4, 4, 4, 4, 4, 4]
fixed_kds: [1, 1, 1, 1, 1, 1]
fixed_target: [0, 0, 0, 0, 0, 0]

# fixed_joint2motor_idx: []
# fixed_kps: []
# fixed_kds: []
# fixed_target: []

policy_path: "~/HumanoidVerse2/logs/FallRec/20260124/160403-STUDENT_TERM_ON_SUCCESS--isaacsim-fall_recovery-g1_23dof/model_last.pt"  # sim new

# Robot URDF for Viser. Home-relative so it works for any user.
# Defaults to DEFAULT_URDF_PATH in config.py if omitted.
urdf_path: "~/HumanoidVerse2/humanoidverse/data/robots/g1/g1_23dof_rev_1_0.urdf"


#
policy_format: "torch"   # or "jit" or  " onnx"

ang_vel_scale: 0.25 # obs scale
dof_pos_scale: 1.0  # obs scale
dof_vel_scale: 0.05 # obs scale
action_scale: 0.25 # action not obs

obs_dim: {
    base_ang_vel: 3,
    projected_gravity: 3,
    dof_pos: 23,
    dof_vel: 23,
    actions: 23,
}

# history_actor_long: {
#       base_ang_vel: 10,
#       projected_gravity: 10,
#       dof_pos: 10,
#       dof_vel: 10,
#       actions: 10,
# }

# Phase increment matching MuJoCo script
# ref_motion_phase: 0.00314
max_cmd: [0.2, 0.2, 0.8]
# Command scaling matching MuJoCo config
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 23
num_obs: 75            

# Command initialization from MuJoCo config
cmd_init: [0, 0, 0]


clip_actions: 100.
clip_obs: 100.
