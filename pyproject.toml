[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-deploy"
version = "0.1.0"
description = "G1 deployment tools: RISE, VIGOR, SONIC, and sensor viewing"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.0",
    "msgpack>=1.1.0",
    "numpy>=1.26,<2; python_version < '3.12'",
    "numpy>=2,<3; python_version >= '3.12'",
    "omegaconf>=2.3.0",
    "onnxruntime>=1.22.1",
    "opencv-python>=4.11.0.86,<4.12; python_version < '3.12'",
    "opencv-python>=4.12.0.88,<5; python_version >= '3.12'",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "pyzmq>=26.0.0",
    "scipy>=1.16.2",
    "setuptools",
    "termcolor>=3.1.0",
    "viser>=1.0.15",
    "yourdfpy>=0.0.56",
]

[project.optional-dependencies]
# Direct TensorRT execution is the production GPU path. TensorRT itself must
# match the deployment machine's CUDA/driver installation.
tensorrt = [
    "torch>=2.7.0",
    "tensorrt>=10.0.0",
]
test = [
    "onnx>=1.18.0",
]

[tool.uv]
managed = true

[tool.setuptools]
py-modules = ["zero_torque"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "vigor*", "sonic*", "rise*"]

[tool.black]
line-length = 100
target-version = ["py311"]
