[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e_skin_remote"
version = "0.1.0"
description = "G1 deployment tools: diffusion recovery, SONIC, and sensor viewing"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.0",
    "msgpack>=1.1.0",
    "numpy>=2.4.3",
    "omegaconf>=2.3.0",
    "onnxruntime>=1.22.1",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "pyzmq>=26.0.0",
    "scipy>=1.16.2",
    "setuptools",
    "termcolor>=3.1.0",
    "viser>=1.0.15",
    "yourdfpy>=0.0.56",
]

[project.optional-dependencies]
# Direct TensorRT execution is the production GPU path. TensorRT itself must
# match the deployment machine's CUDA/driver installation.
tensorrt = [
    "torch>=2.7.0",
    "tensorrt>=10.0.0",
]
test = [
    "onnx>=1.18.0",
]

[tool.uv]
managed = true

[tool.setuptools]
py-modules = ["deploy_vigor", "deploy_eskin", "zero_torque"]

[tool.setuptools.packages.find]
where = [".", "steerable-recovery"]
include = ["core*", "vigor*", "sonic*", "steerable_recovery*"]
