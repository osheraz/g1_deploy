# Robot geometry/limits only. Policy gains, default pose and action scale come
# from the selected decoder checkpoint and its verified training config.
extends: ../../configs/g1_29dof_sonic.yaml

bundle: /nfs/turbo/coe-stellayu/clhsieh/software/hv2_diffusion/releases/recovery/deployment
network_interface: enp132s0
mode_machine: 5
tracker_device: cuda:0
planner_device: cuda:0

camera:
  source: network
  endpoint: tcp://127.0.0.1:15556
  clock_endpoint: tcp://127.0.0.1:15558
  serial: '247122073927'
  base_intrinsics: [388.811767578125, 388.811767578125, 326.99853515625, 238.08714294433594]
  mount_confirmed: true
  # Sensor geometry must be checked against the selected checkpoint.
  allow_intrinsics_mismatch: false

# Recovery can be prone: do not inherit SONIC's standing-only tilt restriction.
# SONIC-style direct PD targets and measured-speed stop; joint positions are logged.
max_joint_velocity: 35.0
# After a command gap, retain position support at the latest measured pose.
# This selects recoverable hold, never timing-triggered damping/session shutdown.
max_command_age_s: 0.06

default_backend: pytorch
exports: {}

# Osher retained execution pairs; saved checkpoints and recipes stay authoritative.
models:
  s25r_diffusion:
    default_backend: tensorrt
    bundle: logs/native_recovery/bundles/s25r_40k_20260921
    exports:
      controller: logs/native_recovery/exports_s25r_20260921/controller
      s25r_diffusion: logs/native_recovery/exports_s25r_20260921/planner
